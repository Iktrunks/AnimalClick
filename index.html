<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AnimalClick</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            touch-action: manipulation;
            user-select: none;
            background: #222;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            transition: background 0.8s ease;
            overflow: hidden;
        }

        .grass-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, #7cfc00 0%, #2e8b57 100%);
            border-top: 10px solid #55cc00;
            transition: filter 0.8s ease;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
            filter: blur(5px);
            animation: moveClouds linear infinite;
        }

        @keyframes moveClouds {
            from { left: -200px; }
            to { left: 100vw; }
        }

        .flower {
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
        }

        .animal {
            position: absolute;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .animal-emoji {
            font-size: 4rem;
            filter: drop-shadow(4px 4px 6px rgba(0,0,0,0.3));
            user-select: none;
        }

        .health-bar {
            width: 50px;
            height: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            border: 1px solid white;
            margin-top: 5px;
            overflow: hidden;
        }

        .health-fill {
            height: 100%;
            background: #ff4757;
            width: 100%;
            transition: width 0.2s ease;
        }

        .score-float, .time-float {
            position: absolute;
            font-weight: 900;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 60;
        }

        .score-float { color: #ffd700; font-size: 1.5rem; }
        .time-float { color: #00f2fe; font-size: 1.8rem; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            pointer-events: none;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #mute-btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: transform 0.1s, background 0.2s;
        }

        .btn {
            pointer-events: auto;
            background: #ff6b6b;
            padding: 16px 40px;
            border-radius: 50px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            color: white;
            border: 4px solid #ee5253;
            cursor: pointer;
            box-shadow: 0 6px 0 #c0392b;
            transition: all 0.1s;
        }

        .btn:active {
            box-shadow: 0 2px 0 #c0392b;
            transform: translateY(4px);
        }

        .btn-secondary {
            background: #4facfe;
            border-color: #0088cc;
            box-shadow: 0 6px 0 #006699;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 200;
            color: white;
            text-align: center;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .game-title {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(3rem, 10vw, 5rem);
            background: linear-gradient(to bottom, #ffeb3b, #f44336);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.2));
            margin-bottom: 10px;
        }

        .achievement-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 10px;
            border: 2px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .mastery-0 { border-color: rgba(255,255,255,0.1); opacity: 0.6; filter: grayscale(1); }
        .mastery-1 { border-color: #cd7f32; background: rgba(205, 127, 50, 0.1); }
        .mastery-2 { border-color: #c0c0c0; background: rgba(192, 192, 192, 0.1); }
        .mastery-3 { border-color: #ffd700; background: rgba(255, 215, 0, 0.1); }
        .mastery-4 { border-color: #e5e4e2; background: rgba(229, 228, 226, 0.15); box-shadow: 0 0 10px rgba(255,255,255,0.2); }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 650px;
            margin-top: 20px;
            padding-bottom: 40px;
        }

        .bg-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 10px;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .bg-card.selected { border-color: #4facfe; background: rgba(79, 172, 254, 0.2); }
        .bg-card.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.8); }

        .bg-preview {
            width: 100%;
            height: 60px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .tab-btn.active { background: #4facfe; color: white; }

        .shake { animation: shake 0.2s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .time-pulse { animation: timePulse 0.5s ease-out; }
        @keyframes timePulse {
            0% { transform: scale(1); color: white; }
            50% { transform: scale(1.4); color: #00f2fe; }
            100% { transform: scale(1); color: white; }
        }

        #overlay::-webkit-scrollbar { width: 8px; }
        #overlay::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="clouds-container"></div>
    <div class="grass-layer" id="main-grass">
        <div id="flowers-container"></div>
    </div>

    <div id="ui-layer">
        <div>
            <div class="text-3xl font-bold" style="font-family: 'Fredoka One'">PUNTOS: <span id="score">0</span></div>
            <div class="text-lg opacity-90">Récord: <span id="high-score-ui">0</span></div>
        </div>
        <div class="flex items-start gap-4">
            <div class="text-center">
                <div class="text-4xl font-black bg-white/20 px-4 py-1 rounded-full inline-block min-w-[80px]" id="timer">30</div>
                <div class="text-xs mt-1 font-bold">TIEMPO</div>
            </div>
            <button id="mute-btn">🔊</button>
        </div>
    </div>

    <div id="overlay"></div>
</div>

<script>
    // --- ESTADO GLOBAL Y PERSISTENCIA ---
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'animal-clicker-v2';
    
    let stats = JSON.parse(localStorage.getItem(appId + '-stats')) || {
        '🦋': 0, '🐇': 0, '🐦': 0, '🦊': 0, '🦌': 0, '⏳': 0
    };
    
    let highScore = localStorage.getItem(appId + '-highscore') || 0;
    let currentBackground = localStorage.getItem(appId + '-bg-id') || 'default';
    let currentTab = 'achievements';

    // --- CONFIGURACIÓN DE FONDOS ---
    const BACKGROUNDS = {
        'default': { name: 'Original', main: 'linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%)', grass: 'hue-rotate(0deg)' },
        // 🦋 Primavera
        '🦋-1': { name: 'Pétalos', main: 'linear-gradient(to bottom, #ff9a9e 0%, #fad0c4 100%)', grass: 'hue-rotate(320deg) brightness(1.2)' },
        '🦋-2': { name: 'Jardín Rosa', main: 'linear-gradient(to bottom, #fbc2eb 0%, #a6c1ee 100%)', grass: 'hue-rotate(280deg)' },
        '🦋-3': { name: 'Floración', main: 'linear-gradient(120deg, #d4fc79 0%, #96e6a1 100%)', grass: 'hue-rotate(40deg) saturate(1.5)' },
        '🦋-4': { name: 'Paraíso', main: 'linear-gradient(to top, #30cfd0 0%, #330867 100%)', grass: 'hue-rotate(180deg) brightness(0.8)' },
        // 🐇 Verano
        '🐇-1': { name: 'Pradera Sol', main: 'linear-gradient(to bottom, #fff1eb 0%, #ace0f9 100%)', grass: 'brightness(1.3)' },
        '🐇-2': { name: 'Mediodía', main: 'linear-gradient(to bottom, #48c6ef 0%, #6f86d6 100%)', grass: 'hue-rotate(20deg)' },
        '🐇-3': { name: 'Calor Real', main: 'linear-gradient(to top, #fccb90 0%, #d57eeb 100%)', grass: 'sepia(0.3) hue-rotate(10deg)' },
        '🐇-4': { name: 'Oasis', main: 'linear-gradient(to right, #43e97b 0%, #38f9d7 100%)', grass: 'hue-rotate(60deg) contrast(1.2)' },
        // 🐦 Cielo
        '🐦-1': { name: 'Nubes Bajas', main: 'linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%)', grass: 'grayscale(0.2) opacity(0.8)' },
        '🐦-2': { name: 'Azul Puro', main: 'linear-gradient(to top, #209cff 0%, #68e0cf 100%)', grass: 'hue-rotate(140deg)' },
        '🐦-3': { name: 'Atardecer', main: 'linear-gradient(to top, #f83600 0%, #f9d423 100%)', grass: 'sepia(0.8) brightness(0.7)' },
        '🐦-4': { name: 'Espacio Vio', main: 'linear-gradient(to top, #6a11cb 0%, #2575fc 100%)', grass: 'hue-rotate(240deg) brightness(0.5)' },
        // 🦊 Otoño
        '🦊-1': { name: 'Hojas Secas', main: 'linear-gradient(to top, #e6b980 0%, #eacda3 100%)', grass: 'sepia(0.6)' },
        '🦊-2': { name: 'Cosecha', main: 'linear-gradient(to top, #ff0844 0%, #ffb199 100%)', grass: 'hue-rotate(-30deg) saturate(1.5)' },
        '🦊-3': { name: 'Bosque Rojo', main: 'linear-gradient(to right, #f78ca0 0%, #f9748f 19%, #fd868c 60%, #fe9a8b 100%)', grass: 'hue-rotate(-50deg)' },
        '🦊-4': { name: 'Ocaso Zorro', main: 'linear-gradient(to top, #303395 0%, #27ef9f 100%)', grass: 'invert(0.1) hue-rotate(200deg)' },
        // 🦌 Invierno/Magia
        '🦌-1': { name: 'Escarcha', main: 'linear-gradient(to top, #e6e9f0 0%, #eef1f5 100%)', grass: 'grayscale(0.8) brightness(1.2)' },
        '🦌-2': { name: 'Lago Helado', main: 'linear-gradient(to top, #cfd9df 0%, #e2ebf0 100%)', grass: 'hue-rotate(190deg) brightness(1.1)' },
        '🦌-3': { name: 'Aurora', main: 'linear-gradient(to top, #00c6fb 0%, #005bea 100%)', grass: 'hue-rotate(160deg) saturate(2)' },
        '🦌-4': { name: 'Noche Mágica', main: 'linear-gradient(to top, #09203f 0%, #537895 100%)', grass: 'brightness(0.3) hue-rotate(220deg)' },
        // ⏳ Tiempo
        '⏳-1': { name: 'Tic-Tac', main: 'linear-gradient(to bottom, #606c88, #3f4c6b)', grass: 'grayscale(0.5)' },
        '⏳-4': { name: 'Eternidad', main: 'linear-gradient(to bottom, #000000, #434343)', grass: 'grayscale(1) brightness(0.2)' }
    };

    const MASTERIES = [
        { name: 'Novato', color: '#888', min: 0 },
        { name: 'Bronce', color: '#cd7f32', min: 1 },
        { name: 'Plata', color: '#c0c0c0', min: 2 },
        { name: 'Oro', color: '#ffd700', min: 3 },
        { name: 'Maestro', color: '#e5e4e2', min: 4 }
    ];

    const ACHIEVEMENT_CONFIG = {
        '🦋': { name: 'Entomólogo', steps: [20, 50, 100, 250] },
        '🐇': { name: 'Velocista', steps: [15, 40, 80, 200] },
        '🐦': { name: 'Aviador', steps: [10, 30, 60, 150] },
        '🦊': { name: 'Astuto', steps: [5, 20, 50, 120] },
        '🦌': { name: 'Majestuoso', steps: [5, 15, 40, 100] },
        '⏳': { name: 'Crononauta', steps: [10, 25, 50, 100] }
    };

    // --- AUDIO ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const masterGain = audioCtx.createGain();
    masterGain.connect(audioCtx.destination);
    let musicInterval = null, currentMusicType = null, isMuted = false;

    function playSound(freq, type, duration, vol = 0.1) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function toggleMute() {
        isMuted = !isMuted;
        masterGain.gain.setValueAtTime(isMuted ? 0 : 1, audioCtx.currentTime);
        document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';
    }
    document.getElementById('mute-btn').onclick = (e) => { e.stopPropagation(); toggleMute(); };

    function updateMusic(type) {
        if (currentMusicType === type) return;
        currentMusicType = type;
        if (musicInterval) clearInterval(musicInterval);
        if (type === 'menu') {
            const menuNotes = [329.63, 0, 392.00, 0, 440.00, 0, 392.00, 0]; 
            let step = 0;
            musicInterval = setInterval(() => {
                if (gameActive) return;
                if (menuNotes[step % menuNotes.length] > 0) playSound(menuNotes[step % menuNotes.length], 'triangle', 0.8, 0.03);
                step++;
            }, 600);
        } else if (type === 'game') {
            const gameNotes = [261.63, 261.63, 392.00, 392.00, 440.00, 440.00, 392.00, 0, 349.23, 349.23, 329.63, 329.63, 293.66, 293.66, 261.63, 0];
            let step = 0;
            musicInterval = setInterval(() => {
                if (!gameActive) return;
                const freq = gameNotes[step % gameNotes.length];
                if (freq > 0) { playSound(freq, 'square', 0.2, 0.03); if (step % 2 === 0) playSound(freq / 2, 'sine', 0.2, 0.05); }
                if (step % 4 === 0) playSound(50, 'sawtooth', 0.05, 0.04);
                step++;
            }, 150);
        }
    }

    // --- LÓGICA DEL JUEGO ---
    const container = document.getElementById('game-container');
    const cloudsContainer = document.getElementById('clouds-container');
    const flowersContainer = document.getElementById('flowers-container');
    const scoreEl = document.getElementById('score');
    const highScoreUI = document.getElementById('high-score-ui');
    const timerEl = document.getElementById('timer');
    const overlay = document.getElementById('overlay');

    let score = 0, timeLeft = 30, gameActive = false, gameInterval, spawnInterval;
    let sessionCaptures = { '🦋': 0, '🐇': 0, '🐦': 0, '🦊': 0, '🦌': 0, '⏳': 0 };

    highScoreUI.innerText = highScore;

    function applyBackground(id) {
        const bg = BACKGROUNDS[id] || BACKGROUNDS['default'];
        container.style.background = bg.main;
        document.getElementById('main-grass').style.filter = bg.grass;
        currentBackground = id;
        localStorage.setItem(appId + '-bg-id', id);
    }

    function createEnvironment() {
        cloudsContainer.innerHTML = ''; flowersContainer.innerHTML = '';
        for(let i=0; i<5; i++) {
            const cloud = document.createElement('div'); cloud.className = 'cloud';
            cloud.style.width = (Math.random() * 150 + 100) + 'px'; cloud.style.height = (Math.random() * 40 + 30) + 'px';
            cloud.style.top = (Math.random() * 40) + '%'; cloud.style.animationDuration = (Math.random() * 20 + 20) + 's';
            cloud.style.animationDelay = (Math.random() * -20) + 's'; cloudsContainer.appendChild(cloud);
        }
        for(let i=0; i<40; i++) {
            const flower = document.createElement('div'); flower.className = 'flower';
            flower.style.left = Math.random() * 100 + '%'; flower.style.top = Math.random() * 100 + '%';
            flower.style.backgroundColor = ['#fff', '#ffeb3b', '#f48fb1', '#ce93d8'][Math.floor(Math.random()*4)]; flowersContainer.appendChild(flower);
        }
    }
    createEnvironment();
    applyBackground(currentBackground);

    const ANIMAL_TYPES = [
        { emoji: '🦋', points: 10, speed: 2.2, clicks: 1, chance: 0.35, type: 'animal' },
        { emoji: '🐇', points: 25, speed: 3.8, clicks: 1, chance: 0.25, type: 'animal' },
        { emoji: '🐦', points: 50, speed: 5.8, clicks: 1, chance: 0.2, type: 'animal' },
        { emoji: '🦊', points: 100, speed: 7.8, clicks: 2, chance: 0.1, type: 'animal' },
        { emoji: '🦌', points: 250, speed: 10, clicks: 3, chance: 0.05, type: 'animal' },
        { emoji: '⏳', points: 0, speed: 3.5, clicks: 1, chance: 0.08, type: 'item' } 
    ];

    function getAnimalLevel(emoji) {
        const total = stats[emoji] || 0;
        const config = ACHIEVEMENT_CONFIG[emoji];
        let level = 0;
        for(let i=0; i < config.steps.length; i++) {
            if(total >= config.steps[i]) level = i + 1;
        }
        return level;
    }

    function showMainMenu() {
        gameActive = false;
        updateMusic('menu');
        overlay.style.display = 'flex';
        
        let contentHTML = '';

        if (currentTab === 'achievements') {
            contentHTML = `<div class="grid-container">` + Object.entries(ACHIEVEMENT_CONFIG).map(([id, config]) => {
                const total = stats[id] || 0;
                const level = getAnimalLevel(id);
                const nextGoal = level < config.steps.length ? config.steps[level] : config.steps[config.steps.length - 1];
                const prevGoal = level > 0 ? config.steps[level - 1] : 0;
                const progress = level < config.steps.length ? Math.min(100, ((total - prevGoal) / (nextGoal - prevGoal)) * 100) : 100;
                const mastery = MASTERIES[level];

                return `
                    <div class="achievement-card mastery-${level}">
                        <div class="flex justify-between items-start mb-1">
                            <div class="text-2xl">${id}</div>
                            <div class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-white/10" style="color: ${mastery.color}">
                                ${mastery.name.toUpperCase()}
                            </div>
                        </div>
                        <div class="text-[10px] font-bold uppercase text-white/80">${config.name}</div>
                        <div class="text-[8px] mb-2 opacity-60">Lvl ${level} • Total: ${total}</div>
                        <div class="w-full bg-black/30 h-1.5 rounded-full overflow-hidden">
                            <div class="h-full transition-all" style="width: ${progress}%; background-color: ${mastery.color}"></div>
                        </div>
                    </div>
                `;
            }).join('') + `</div>`;
        } else {
            // PESTAÑA DE FONDOS
            contentHTML = `<div class="grid-container">`;
            // Default
            contentHTML += `
                <div class="bg-card ${currentBackground === 'default' ? 'selected' : ''}" onclick="applyBackground('default'); showMainMenu();">
                    <div class="bg-preview" style="background: ${BACKGROUNDS['default'].main}"></div>
                    <div class="text-xs font-bold">Original</div>
                    <div class="text-[8px] opacity-60">Inicial</div>
                </div>
            `;
            // Fondos por maestría
            Object.keys(ACHIEVEMENT_CONFIG).forEach(emoji => {
                const userLevel = getAnimalLevel(emoji);
                for(let i=1; i<=4; i++) {
                    const bgId = `${emoji}-${i}`;
                    if (!BACKGROUNDS[bgId]) continue;
                    const isLocked = userLevel < i;
                    contentHTML += `
                        <div class="bg-card ${currentBackground === bgId ? 'selected' : ''} ${isLocked ? 'locked' : ''}" 
                             onclick="${isLocked ? '' : `applyBackground('${bgId}'); showMainMenu();`}">
                            <div class="bg-preview" style="background: ${BACKGROUNDS[bgId].main}">
                                ${isLocked ? '<div class="w-full h-full flex items-center justify-center bg-black/40">🔒</div>' : ''}
                            </div>
                            <div class="text-[10px] font-bold">${emoji} ${BACKGROUNDS[bgId].name}</div>
                            <div class="text-[8px] opacity-60">${isLocked ? 'Bloqueado' : 'Desbloqueado'}</div>
                        </div>
                    `;
                }
            });
            contentHTML += `</div>`;
        }

        overlay.innerHTML = `
            <h1 class="game-title">AnimalClick</h1>
            <div class="text-yellow-400 font-bold text-2xl mb-4">🏆 Récord: ${highScore}</div>
            
            <div class="tab-nav">
                <div class="tab-btn ${currentTab === 'achievements' ? 'active' : ''}" onclick="switchTab('achievements')">LOGROS</div>
                <div class="tab-btn ${currentTab === 'backgrounds' ? 'active' : ''}" onclick="switchTab('backgrounds')">FONDOS</div>
            </div>

            <button id="start-btn" class="btn mb-4">¡JUGAR AHORA!</button>
            
            ${contentHTML}
        `;
        
        document.getElementById('start-btn').onclick = () => startGame();
    }

    window.switchTab = (tab) => {
        currentTab = tab;
        showMainMenu();
    };

    function createEntity(forceItem = false) {
        if (!gameActive) return;
        let type;
        if (forceItem) { type = ANIMAL_TYPES.find(t => t.type === 'item'); } 
        else {
            let rand = Math.random(), cumulative = 0; type = ANIMAL_TYPES[0];
            for (const t of ANIMAL_TYPES) { cumulative += t.chance; if (rand < cumulative) { type = t; break; } }
        }

        const entity = document.createElement('div');
        entity.className = 'animal';
        let health = type.clicks;
        entity.innerHTML = `<div class="animal-emoji">${type.emoji}</div><div class="health-bar" style="display: ${type.clicks > 1 ? 'block' : 'none'}"><div class="health-fill"></div></div>`;

        const side = Math.floor(Math.random() * 4);
        let startX, startY, endX, endY;
        const pad = 120;
        if (side === 0) { startX = -pad; startY = Math.random()*innerHeight; endX = innerWidth+pad; endY = Math.random()*innerHeight; }
        else if (side === 1) { startX = innerWidth+pad; startY = Math.random()*innerHeight; endX = -pad; endY = Math.random()*innerHeight; }
        else if (side === 2) { startX = Math.random()*innerWidth; startY = -pad; endX = Math.random()*innerWidth; endY = innerHeight+pad; }
        else { startX = Math.random()*innerWidth; startY = innerHeight+pad; endX = Math.random()*innerWidth; endY = -pad; }

        entity.style.left = `${startX}px`; entity.style.top = `${startY}px`;
        container.appendChild(entity);

        if (type.type === 'item') {
            const clocksCaughtSession = sessionCaptures['⏳'];
            const effectiveSpeed = type.speed + (clocksCaughtSession * 0.4); 
            const duration = (10000 / effectiveSpeed) + (Math.random() * 1000);
            const startTime = performance.now();
            const amplitude = 50 + (clocksCaughtSession * 25); 
            const frequency = 0.005 + (clocksCaughtSession * 0.001);

            function updateClockPos(currentTime) {
                if (!gameActive || !entity.parentElement) return;
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const curX = startX + (endX - startX) * progress;
                const curY = startY + (endY - startY) * progress;
                const offset = Math.sin(elapsed * frequency) * amplitude * (1 - progress);
                const angle = Math.atan2(endY - startY, endX - startX);
                entity.style.left = `${curX + Math.cos(angle + Math.PI/2) * offset}px`;
                entity.style.top = `${curY + Math.sin(angle + Math.PI/2) * offset}px`;
                if (progress < 1) requestAnimationFrame(updateClockPos); else entity.remove();
            }
            requestAnimationFrame(updateClockPos);
        } else {
            const duration = (10000 / type.speed) + (Math.random() * 1000);
            const animation = entity.animate([{ left: `${startX}px`, top: `${startY}px` }, { left: `${endX}px`, top: `${endY}px` }], { duration, easing: 'linear' });
            animation.onfinish = () => entity.remove();
        }

        const handler = (e) => {
            e.preventDefault(); if (!gameActive) return;
            health--;
            if (health > 0) {
                playSound(100, 'sawtooth', 0.1, 0.08);
                const fill = entity.querySelector('.health-fill');
                if (fill) fill.style.width = `${(health / type.clicks) * 100}%`;
                entity.classList.remove('shake'); void entity.offsetWidth; entity.classList.add('shake'); return;
            }
            sessionCaptures[type.emoji]++;
            if (type.type === 'item') {
                timeLeft += 5; timerEl.innerText = timeLeft; timerEl.classList.add('time-pulse');
                setTimeout(() => timerEl.classList.remove('time-pulse'), 500); playSound(1318, 'triangle', 0.5, 0.1);
            } else {
                score += type.points; scoreEl.innerText = score; playSound(600 + (Math.random() * 200), 'sine', 0.2, 0.1);
            }
            const float = document.createElement('div');
            float.className = type.type === 'item' ? 'time-float' : 'score-float';
            float.innerText = type.type === 'item' ? '+5s' : `+${type.points}`;
            float.style.left = `${entity.offsetLeft}px`; float.style.top = `${entity.offsetTop}px`;
            container.appendChild(float); setTimeout(() => float.remove(), 800); entity.remove();
        };
        entity.addEventListener('mousedown', handler); entity.addEventListener('touchstart', handler, {passive: false});
    }

    function startGame() {
        score = 0; timeLeft = 30; sessionCaptures = { '🦋': 0, '🐇': 0, '🐦': 0, '🦊': 0, '🦌': 0, '⏳': 0 };
        gameActive = true; scoreEl.innerText = score; timerEl.innerText = timeLeft;
        overlay.style.display = 'none'; updateMusic('game');
        document.querySelectorAll('.animal').forEach(a => a.remove());
        spawnInterval = setInterval(() => {
            createEntity(); if (score > 500 && Math.random() > 0.6) createEntity();
            if (timeLeft < 15 && Math.random() > 0.75) createEntity(true);
        }, 750);
        gameInterval = setInterval(() => { timeLeft--; timerEl.innerText = timeLeft; if (timeLeft <= 0) endGame(); }, 1000);
    }

    function endGame() {
        gameActive = false; clearInterval(gameInterval); clearInterval(spawnInterval);
        Object.keys(sessionCaptures).forEach(key => stats[key] = (stats[key] || 0) + sessionCaptures[key]);
        localStorage.setItem(appId + '-stats', JSON.stringify(stats));
        if (score > highScore) { highScore = score; localStorage.setItem(appId + '-highscore', highScore); }

        overlay.innerHTML = `
            <h1 class="game-title">¡TIEMPO AGOTADO!</h1>
            <div class="text-4xl mb-4 font-bold text-yellow-300">${score} PUNTOS</div>
            <div class="bg-black/30 p-4 rounded-3xl mb-8 w-full max-w-sm border border-white/10">
                <div class="grid grid-cols-3 gap-2">
                    ${Object.entries(sessionCaptures).map(([emoji, count]) => `
                        <div class="bg-white/5 rounded-xl p-2">
                            <span class="text-xl">${emoji}</span>
                            <div class="text-lg font-bold">${count}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
            <div class="flex flex-col gap-4 w-full max-w-xs">
                <button id="restart-btn" class="btn w-full">REINTENTAR</button>
                <button id="main-menu-btn" class="btn btn-secondary w-full">VOLVER AL MENU</button>
            </div>
        `;
        overlay.style.display = 'flex';
        document.getElementById('restart-btn').onclick = () => startGame();
        document.getElementById('main-menu-btn').onclick = () => showMainMenu();
    }

    window.addEventListener('click', () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (!gameActive && currentMusicType !== 'menu') updateMusic('menu');
    }, { once: false });

    showMainMenu();
</script>
