<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AnimalClick Global</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, query, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'animal-clicker-v2';

        window.db = db;
        window.auth = auth;
        window.appId = appId;
        window.leaderboardData = [];

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        initAuth();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUser = user;
                setupLeaderboardListener();
            }
        });

        function setupLeaderboardListener() {
            const lbRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            onSnapshot(lbRef, (snapshot) => {
                const rawData = [];
                snapshot.forEach(doc => rawData.push(doc.data()));
                window.leaderboardData = rawData.sort((a, b) => b.score - a.score).slice(0, 50);
                if (window.currentTab === 'leaderboard' && typeof window.updateLeaderboardUI === 'function') {
                    window.updateLeaderboardUI();
                }
            }, (err) => console.error("Error en leaderboard:", err));
        }

        window.uploadScore = async (username, score) => {
            if (!window.currentUser) return;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', window.currentUser.uid), {
                    uid: window.currentUser.uid,
                    username: username,
                    score: score,
                    timestamp: Date.now()
                });
            } catch (e) {
                console.error("Error al subir puntuación:", e);
            }
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            touch-action: manipulation;
            user-select: none;
            background: #222;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            transition: background 0.8s ease;
            overflow: hidden;
        }

        .grass-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, #7cfc00 0%, #2e8b57 100%);
            border-top: 10px solid #55cc00;
            transition: filter 0.8s ease;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
            filter: blur(5px);
            animation: moveClouds linear infinite;
        }

        @keyframes moveClouds {
            from { left: -200px; }
            to { left: 100vw; }
        }

        .flower {
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
        }

        .animal {
            position: absolute;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            will-change: transform, left, top;
        }

        .animal-emoji {
            font-size: 4rem;
            filter: drop-shadow(4px 4px 6px rgba(0,0,0,0.3));
        }

        .health-bar {
            width: 50px;
            height: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            border: 1px solid white;
            margin-top: 5px;
            overflow: hidden;
        }

        .health-fill {
            height: 100%;
            background: #ff4757;
            width: 100%;
            transition: width 0.2s ease;
        }

        .score-float, .time-float {
            position: absolute;
            font-weight: 900;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 60;
        }

        .score-float { color: #ffd700; font-size: 1.5rem; }
        .time-float { color: #00f2fe; font-size: 1.8rem; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            pointer-events: none;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #mute-btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .btn {
            pointer-events: auto;
            background: #ff6b6b;
            padding: 14px 30px;
            border-radius: 50px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            color: white;
            border: 4px solid #ee5253;
            cursor: pointer;
            box-shadow: 0 6px 0 #c0392b;
            transition: all 0.1s;
        }

        .btn:active {
            box-shadow: 0 2px 0 #c0392b;
            transform: translateY(4px);
        }

        .btn-secondary {
            background: #4facfe;
            border-color: #0088cc;
            box-shadow: 0 6px 0 #006699;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 200;
            color: white;
            text-align: center;
            overflow-y: auto;
            padding: 40px 15px;
        }

        .game-title {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(2.5rem, 8vw, 4rem);
            background: linear-gradient(to bottom, #ffeb3b, #f44336);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        input[type="text"] {
            background: rgba(255,255,255,0.1);
            border: 3px solid #4facfe;
            border-radius: 15px;
            padding: 12px;
            color: white;
            font-size: 1.2rem;
            text-align: center;
            width: 100%;
            max-width: 300px;
            margin: 20px 0;
            outline: none;
        }

        .leaderboard-table {
            width: 100%;
            max-width: 500px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            overflow: hidden;
            margin-top: 10px;
        }
        .lb-row {
            display: grid;
            grid-template-columns: 50px 1fr 100px;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            align-items: center;
            font-size: 0.9rem;
        }
        .lb-row.me { background: rgba(79, 172, 254, 0.2); border-left: 4px solid #4facfe; }
        .lb-rank { font-weight: 900; opacity: 0.5; font-style: italic; }
        .lb-name { text-align: left; padding-left: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lb-score { text-align: right; color: #ffd700; font-family: 'Fredoka One', cursive; }

        .tab-nav { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
        .tab-btn {
            background: rgba(255,255,255,0.1);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active { background: #4facfe; color: white; transform: scale(1.05); }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 600px;
            margin-top: 15px;
        }

        .achievement-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 10px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .mastery-1 { border-color: #cd7f32; background: rgba(205, 127, 50, 0.1); }
        .mastery-2 { border-color: #c0c0c0; background: rgba(192, 192, 192, 0.1); }
        .mastery-3 { border-color: #ffd700; background: rgba(255, 215, 0, 0.1); }
        .mastery-4 { border-color: #e5e4e2; background: rgba(229, 228, 226, 0.15); box-shadow: 0 0 10px rgba(255,255,255,0.2); }

        .bg-card {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 8px;
            border: 3px solid transparent;
            cursor: pointer;
        }
        .bg-card.selected { border-color: #4facfe; }
        .bg-card.locked { opacity: 0.4; filter: grayscale(1); }
        .bg-preview { width: 100%; height: 50px; border-radius: 6px; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="clouds-container"></div>
    <div class="grass-layer" id="main-grass">
        <div id="flowers-container"></div>
    </div>

    <div id="ui-layer">
        <div>
            <div class="text-2xl md:text-3xl font-bold" style="font-family: 'Fredoka One'">PUNTOS: <span id="score">0</span></div>
            <div class="text-sm opacity-90">Récord: <span id="high-score-ui">0</span></div>
        </div>
        <div class="flex items-start gap-4">
            <div class="text-center">
                <div class="text-3xl md:text-4xl font-black bg-white/20 px-4 py-1 rounded-full inline-block" id="timer">30</div>
            </div>
            <button id="mute-btn">🔊</button>
        </div>
    </div>

    <div id="overlay"></div>
</div>

<script>
    // --- ESTADO Y CONFIGURACIÓN ---
    const localId = typeof __app_id !== 'undefined' ? __app_id : 'animal-clicker-v2';
    
    let stats = JSON.parse(localStorage.getItem(localId + '-stats')) || { '🦋': 0, '🐇': 0, '🐦': 0, '🦊': 0, '🦌': 0, '⏳': 0 };
    let highScore = parseInt(localStorage.getItem(localId + '-highscore')) || 0;
    let currentBackground = localStorage.getItem(localId + '-bg-id') || 'default';
    let userName = localStorage.getItem(localId + '-username') || '';
    window.currentTab = 'achievements';

    const BACKGROUNDS = {
        'default': { name: 'Original', main: 'linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%)', grass: 'hue-rotate(0deg)' },
        '🦋-1': { name: 'Pétalos', main: 'linear-gradient(to bottom, #ff9a9e 0%, #fad0c4 100%)', grass: 'hue-rotate(320deg) brightness(1.2)' },
        '🦋-2': { name: 'Jardín Rosa', main: 'linear-gradient(to bottom, #fbc2eb 0%, #a6c1ee 100%)', grass: 'hue-rotate(280deg)' },
        '🦋-3': { name: 'Floración', main: 'linear-gradient(120deg, #d4fc79 0%, #96e6a1 100%)', grass: 'hue-rotate(40deg) saturate(1.5)' },
        '🦋-4': { name: 'Paraíso', main: 'linear-gradient(to top, #30cfd0 0%, #330867 100%)', grass: 'hue-rotate(180deg) brightness(0.8)' },
        '🐇-1': { name: 'Pradera Sol', main: 'linear-gradient(to bottom, #fff1eb 0%, #ace0f9 100%)', grass: 'brightness(1.3)' },
        '🐇-2': { name: 'Mediodía', main: 'linear-gradient(to bottom, #48c6ef 0%, #6f86d6 100%)', grass: 'hue-rotate(20deg)' },
        '🐇-3': { name: 'Calor Real', main: 'linear-gradient(to top, #fccb90 0%, #d57eeb 100%)', grass: 'sepia(0.3) hue-rotate(10deg)' },
        '🐇-4': { name: 'Oasis', main: 'linear-gradient(to right, #43e97b 0%, #38f9d7 100%)', grass: 'hue-rotate(60deg) contrast(1.2)' },
        '🐦-1': { name: 'Nubes Bajas', main: 'linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%)', grass: 'grayscale(0.2) opacity(0.8)' },
        '🐦-2': { name: 'Azul Puro', main: 'linear-gradient(to top, #209cff 0%, #68e0cf 100%)', grass: 'hue-rotate(140deg)' },
        '🐦-3': { name: 'Atardecer', main: 'linear-gradient(to top, #f83600 0%, #f9d423 100%)', grass: 'sepia(0.8) brightness(0.7)' },
        '🐦-4': { name: 'Espacio Vio', main: 'linear-gradient(to top, #6a11cb 0%, #2575fc 100%)', grass: 'hue-rotate(240deg) brightness(0.5)' },
        '🦊-1': { name: 'Hojas Secas', main: 'linear-gradient(to top, #e6b980 0%, #eacda3 100%)', grass: 'sepia(0.6)' },
        '🦊-2': { name: 'Cosecha', main: 'linear-gradient(to top, #ff0844 0%, #ffb199 100%)', grass: 'hue-rotate(-30deg) saturate(1.5)' },
        '🦊-3': { name: 'Bosque Rojo', main: 'linear-gradient(to right, #f78ca0 0%, #f9748f 19%, #fd868c 60%, #fe9a8b 100%)', grass: 'hue-rotate(-50deg)' },
        '🦊-4': { name: 'Ocaso Zorro', main: 'linear-gradient(to top, #303395 0%, #27ef9f 100%)', grass: 'invert(0.1) hue-rotate(200deg)' },
        '🦌-1': { name: 'Escarcha', main: 'linear-gradient(to top, #e6e9f0 0%, #eef1f5 100%)', grass: 'grayscale(0.8) brightness(1.2)' },
        '🦌-2': { name: 'Lago Helado', main: 'linear-gradient(to top, #cfd9df 0%, #e2ebf0 100%)', grass: 'hue-rotate(190deg) brightness(1.1)' },
        '🦌-3': { name: 'Aurora', main: 'linear-gradient(to top, #00c6fb 0%, #005bea 100%)', grass: 'hue-rotate(160deg) saturate(2)' },
        '🦌-4': { name: 'Noche Mágica', main: 'linear-gradient(to top, #09203f 0%, #537895 100%)', grass: 'brightness(0.3) hue-rotate(220deg)' },
        '⏳-1': { name: 'Tic-Tac', main: 'linear-gradient(to bottom, #606c88, #3f4c6b)', grass: 'grayscale(0.5)' },
        '⏳-4': { name: 'Eternidad', main: 'linear-gradient(to bottom, #000000, #434343)', grass: 'grayscale(1) brightness(0.2)' }
    };

    const MASTERIES = [
        { name: 'Novato', color: '#888' },
        { name: 'Bronce', color: '#cd7f32' },
        { name: 'Plata', color: '#c0c0c0' },
        { name: 'Oro', color: '#ffd700' },
        { name: 'Maestro', color: '#e5e4e2' }
    ];

    const ACHIEVEMENT_CONFIG = {
        '🦋': { name: 'Entomólogo', steps: [20, 50, 100, 250] },
        '🐇': { name: 'Velocista', steps: [15, 40, 80, 200] },
        '🐦': { name: 'Aviador', steps: [10, 30, 60, 150] },
        '🦊': { name: 'Astuto', steps: [5, 20, 50, 120] },
        '🦌': { name: 'Majestuoso', steps: [5, 15, 40, 100] },
        '⏳': { name: 'Crononauta', steps: [10, 25, 50, 100] }
    };

    // --- AUDIO ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const masterGain = audioCtx.createGain();
    masterGain.connect(audioCtx.destination);
    let musicInterval = null, currentMusicType = null, isMuted = false;

    function playSound(freq, type, duration, vol = 0.1) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function toggleMute() {
        isMuted = !isMuted;
        masterGain.gain.setValueAtTime(isMuted ? 0 : 1, audioCtx.currentTime);
        document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.getElementById('mute-btn').onclick = (e) => { e.stopPropagation(); toggleMute(); };

    function updateMusic(type) {
        if (currentMusicType === type) return;
        currentMusicType = type;
        if (musicInterval) clearInterval(musicInterval);
        if (type === 'menu') {
            const menuNotes = [329.63, 0, 392.00, 0, 440.00, 0, 392.00, 0]; 
            let step = 0;
            musicInterval = setInterval(() => {
                if (gameActive) return;
                if (menuNotes[step % menuNotes.length] > 0) playSound(menuNotes[step % menuNotes.length], 'triangle', 0.8, 0.03);
                step++;
            }, 600);
        } else if (type === 'game') {
            const gameNotes = [261.63, 261.63, 392.00, 392.00, 440.00, 440.00, 392.00, 0, 349.23, 349.23, 329.63, 329.63, 293.66, 293.66, 261.63, 0];
            let step = 0;
            musicInterval = setInterval(() => {
                if (!gameActive) return;
                const freq = gameNotes[step % gameNotes.length];
                if (freq > 0) { playSound(freq, 'square', 0.2, 0.03); if (step % 2 === 0) playSound(freq / 2, 'sine', 0.2, 0.05); }
                if (step % 4 === 0) playSound(50, 'sawtooth', 0.05, 0.04);
                step++;
            }, 150);
        }
    }

    // --- LÓGICA JUEGO ---
    const container = document.getElementById('game-container');
    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const highScoreUI = document.getElementById('high-score-ui');

    let score = 0, timeLeft = 30, gameActive = false, gameInterval, spawnInterval;
    let sessionCaptures = { '🦋': 0, '🐇': 0, '🐦': 0, '🦊': 0, '🦌': 0, '⏳': 0 };

    highScoreUI.innerText = highScore;

    function applyBackground(id) {
        const bg = BACKGROUNDS[id] || BACKGROUNDS['default'];
        container.style.background = bg.main;
        document.getElementById('main-grass').style.filter = bg.grass;
        currentBackground = id;
        localStorage.setItem(localId + '-bg-id', id);
    }

    function getAnimalLevel(emoji) {
        const total = stats[emoji] || 0;
        const config = ACHIEVEMENT_CONFIG[emoji];
        let level = 0;
        for(let i=0; i < config.steps.length; i++) if(total >= config.steps[i]) level = i + 1;
        return level;
    }

    window.updateLeaderboardUI = function() {
        const lbContainer = document.getElementById('lb-table-container');
        if (lbContainer) {
            lbContainer.innerHTML = window.leaderboardData.map((player, idx) => `
                <div class="lb-row ${window.currentUser?.uid === player.uid ? 'me' : ''}">
                    <div class="lb-rank">#${idx + 1}</div>
                    <div class="lb-name">${player.username || 'Anónimo'}</div>
                    <div class="lb-score">${player.score}</div>
                </div>
            `).join('') || '<div class="p-8 opacity-40">Cargando clasificación global...</div>';
        }
    }

    window.showMainMenu = function() {
        gameActive = false;
        updateMusic('menu');
        overlay.style.display = 'flex';
        
        if (!userName) {
            overlay.innerHTML = `
                <h1 class="game-title">BIENVENIDO</h1>
                <p class="mb-2 opacity-80">Elige tu nombre para la tabla global:</p>
                <input type="text" id="name-input" maxlength="12" placeholder="Tu Apodo...">
                <button id="save-name-btn" class="btn">LISTO</button>
            `;
            document.getElementById('save-name-btn').onclick = () => {
                const val = document.getElementById('name-input').value.trim();
                if (val.length >= 3) {
                    userName = val;
                    localStorage.setItem(localId + '-username', userName);
                    if (highScore > 0) window.uploadScore(userName, highScore);
                    window.showMainMenu();
                }
            };
            return;
        }

        let bodyHTML = '';
        if (window.currentTab === 'achievements') {
            bodyHTML = `<div class="grid-container">` + Object.entries(ACHIEVEMENT_CONFIG).map(([id, config]) => {
                const total = stats[id] || 0;
                const level = getAnimalLevel(id);
                const nextGoal = level < config.steps.length ? config.steps[level] : config.steps[config.steps.length-1];
                const prevGoal = level > 0 ? config.steps[level-1] : 0;
                const progress = level < config.steps.length ? Math.min(100, ((total - prevGoal)/(nextGoal - prevGoal))*100) : 100;
                return `
                    <div class="achievement-card mastery-${level}">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xl">${id}</span>
                            <span class="text-[9px] font-bold" style="color:${MASTERIES[level].color}">${MASTERIES[level].name}</span>
                        </div>
                        <div class="text-[10px] font-bold uppercase">${config.name}</div>
                        <div class="w-full bg-black/20 h-1 rounded-full mt-2 overflow-hidden">
                            <div class="h-full" style="width:${progress}%; background:${MASTERIES[level].color}"></div>
                        </div>
                    </div>`;
            }).join('') + `</div>`;
        } else if (window.currentTab === 'backgrounds') {
            bodyHTML = `<div class="grid-container">`;
            Object.keys(BACKGROUNDS).forEach(bgId => {
                if(bgId === 'default') {
                    bodyHTML += `<div class="bg-card ${currentBackground === 'default' ? 'selected' : ''}" onclick="applyBackground('default'); showMainMenu();">
                        <div class="bg-preview" style="background:${BACKGROUNDS['default'].main}"></div>
                        <div class="text-[10px] font-bold">Original</div>
                    </div>`;
                } else {
                    const [emoji, level] = bgId.split('-');
                    const userLevel = getAnimalLevel(emoji);
                    const isLocked = userLevel < parseInt(level);
                    bodyHTML += `
                        <div class="bg-card ${currentBackground === bgId ? 'selected' : ''} ${isLocked ? 'locked' : ''}" 
                             onclick="${isLocked ? '' : `applyBackground('${bgId}'); showMainMenu();`}">
                            <div class="bg-preview" style="background:${BACKGROUNDS[bgId].main}">
                                ${isLocked ? '<div class="w-full h-full flex items-center justify-center">🔒</div>' : ''}
                            </div>
                            <div class="text-[9px] font-bold">${emoji} ${BACKGROUNDS[bgId].name}</div>
                        </div>`;
                }
            });
            bodyHTML += `</div>`;
        } else if (window.currentTab === 'leaderboard') {
            bodyHTML = `
                <div class="leaderboard-table">
                    <div class="lb-row opacity-50 text-[10px] font-bold">
                        <div>POS</div><div>JUGADOR</div><div>SCORE</div>
                    </div>
                    <div id="lb-table-container"></div>
                </div>
            `;
            setTimeout(() => window.updateLeaderboardUI(), 10);
        }

        overlay.innerHTML = `
            <h1 class="game-title">AnimalClick</h1>
            <div class="text-yellow-400 font-bold mb-4">🏆 RÉCORD: ${highScore}</div>
            <div class="tab-nav">
                <div class="tab-btn ${window.currentTab === 'achievements' ? 'active' : ''}" onclick="window.currentTab='achievements'; showMainMenu();">LOGROS</div>
                <div class="tab-btn ${window.currentTab === 'leaderboard' ? 'active' : ''}" onclick="window.currentTab='leaderboard'; showMainMenu();">TOP 50</div>
                <div class="tab-btn ${window.currentTab === 'backgrounds' ? 'active' : ''}" onclick="window.currentTab='backgrounds'; showMainMenu();">FONDOS</div>
            </div>
            <button id="start-btn" class="btn mb-4">¡JUGAR!</button>
            ${bodyHTML}
        `;
        document.getElementById('start-btn').onclick = () => startGame();
    }

    // AUMENTO DE VELOCIDADES BASE Y CHANCE DEL CIERVO
    const ANIMAL_TYPES = [
        { emoji: '🦋', points: 10, speed: 2.8, clicks: 1, chance: 0.35, freq: 600 },
        { emoji: '🐇', points: 25, speed: 4.5, clicks: 1, chance: 0.25, freq: 400 },
        { emoji: '🐦', points: 50, speed: 6.5, clicks: 1, chance: 0.2, freq: 800 },
        { emoji: '🦊', points: 100, speed: 8.5, clicks: 2, chance: 0.1, freq: 300 },
        { emoji: '🦌', points: 250, speed: 11.5, clicks: 3, chance: 0.1, freq: 200 }, // Chance aumentada de 0.05 a 0.1
        { emoji: '⏳', points: 0, speed: 3.2, clicks: 1, chance: 0.06, isItem: true, freq: 1200 }
    ];

    function createEntity() {
        if (!gameActive) return;
        
        let type;
        const clockChance = timeLeft <= 10 ? 0.35 : 0.08;
        if (Math.random() < clockChance) {
            type = ANIMAL_TYPES.find(t => t.isItem);
        } else {
            let rand = Math.random(), cumul = 0;
            for (const t of ANIMAL_TYPES) { 
                if (t.isItem) continue; 
                cumul += t.chance; 
                if (rand < cumul) { type = t; break; } 
            }
            if (!type) type = ANIMAL_TYPES[0];
        }

        const entity = document.createElement('div');
        entity.className = 'animal';
        let hp = type.clicks;
        entity.innerHTML = `<div class="animal-emoji">${type.emoji}</div>${type.clicks > 1 ? '<div class="health-bar"><div class="health-fill"></div></div>' : ''}`;

        const side = Math.floor(Math.random() * 4);
        let sx, sy, ex, ey;
        const pad = 100;
        if (side === 0) { sx=-pad; sy=Math.random()*innerHeight; ex=innerWidth+pad; ey=Math.random()*innerHeight; }
        else if (side === 1) { sx=innerWidth+pad; sy=Math.random()*innerHeight; ex=-pad; ey=Math.random()*innerHeight; }
        else if (side === 2) { sx=Math.random()*innerWidth; sy=-pad; ex=Math.random()*innerWidth; ey=innerHeight+pad; }
        else { sx=Math.random()*innerWidth; sy=innerHeight+pad; ex=Math.random()*innerWidth; ey=-pad; }

        container.appendChild(entity);

        let keyframes;
        let currentClockSpeed = type.speed;
        let erraticLevel = 0;

        if (type.isItem) {
            const captures = sessionCaptures['⏳'];
            currentClockSpeed = type.speed + (captures * 0.85); 
            erraticLevel = Math.min(600, captures * 80);

            const midX1 = (sx + ex) * 0.3 + (Math.random() - 0.5) * erraticLevel;
            const midY1 = (sy + ey) * 0.3 + (Math.random() - 0.5) * erraticLevel;
            const midX2 = (sx + ex) * 0.7 + (Math.random() - 0.5) * erraticLevel;
            const midY2 = (sy + ey) * 0.7 + (Math.random() - 0.5) * erraticLevel;

            keyframes = [
                { left: sx + 'px', top: sy + 'px', transform: 'scale(1) rotate(0deg)', offset: 0 },
                { left: midX1 + 'px', top: midY1 + 'px', transform: 'scale(1.2) rotate(45deg)', offset: 0.3 },
                { left: midX2 + 'px', top: midY2 + 'px', transform: 'scale(0.8) rotate(-45deg)', offset: 0.7 },
                { left: ex + 'px', top: ey + 'px', transform: 'scale(1) rotate(0deg)', offset: 1 }
            ];
        } else {
            keyframes = [
                { left: sx + 'px', top: sy + 'px' },
                { left: ex + 'px', top: ey + 'px' }
            ];
        }

        const globalDifficulty = 1 + (score / 10000);
        const durationBase = 10000;
        const finalSpeed = type.isItem ? currentClockSpeed : type.speed;
        
        const anim = entity.animate(keyframes, { 
            duration: (durationBase / (finalSpeed * globalDifficulty)), 
            easing: type.isItem ? 'ease-in-out' : 'linear'
        });
        anim.onfinish = () => entity.remove();

        const hit = (e) => {
            if (e.cancelable) e.preventDefault();
            if(!gameActive) return;
            hp--;
            if (hp > 0) {
                playSound(150, 'sawtooth', 0.1, 0.05);
                const fill = entity.querySelector('.health-fill');
                if (fill) fill.style.width = (hp/type.clicks)*100+'%';
                return;
            }
            
            sessionCaptures[type.emoji]++;
            playSound(type.freq, 'sine', 0.2, 0.1);
            
            if (type.isItem) { 
                timeLeft += 5; 
                timerEl.innerText = timeLeft;
                timerEl.classList.add('text-cyan-400', 'scale-110');
                setTimeout(() => timerEl.classList.remove('text-cyan-400', 'scale-110'), 300);
            } else { 
                score += type.points; scoreEl.innerText = score;
            }

            const float = document.createElement('div');
            float.className = type.isItem ? 'time-float' : 'score-float';
            float.innerText = type.isItem ? '+5s' : `+${type.points}`;
            float.style.left = `${entity.offsetLeft}px`; float.style.top = `${entity.offsetTop}px`;
            container.appendChild(float); setTimeout(() => float.remove(), 1000);
            entity.remove();
        };

        entity.addEventListener('mousedown', hit); 
        entity.addEventListener('touchstart', hit, {passive:false});
    }

    function startGame() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        score = 0; timeLeft = 30; gameActive = true; 
        sessionCaptures = { '🦋': 0, '🐇': 0, '🐦': 0, '🦊': 0, '🦌': 0, '⏳': 0 };
        scoreEl.innerText = 0; timerEl.innerText = 30; overlay.style.display = 'none';
        updateMusic('game');
        
        if (spawnInterval) clearInterval(spawnInterval);
        
        // Función recursiva de spawn para ajustar la velocidad dinámicamente
        const spawnLoop = () => {
            if (!gameActive) return;
            createEntity();
            
            // Si quedan menos de 10 segundos, spawnea a un ritmo frenético (400ms)
            // Si no, ritmo normal (800ms)
            let currentSpawnRate = timeLeft <= 10 ? 400 : 800;
            
            // Si el score es alto, a veces suelta uno extra
            if (score > 3000 && Math.random() < 0.3) createEntity();

            setTimeout(spawnLoop, currentSpawnRate);
        };
        spawnLoop();

        gameInterval = setInterval(() => {
            timeLeft--; timerEl.innerText = timeLeft;
            if (timeLeft <= 0) endGame();
            if (timeLeft <= 5) {
                timerEl.classList.add('text-red-500', 'animate-pulse');
                playSound(100, 'sine', 0.1, 0.02);
            } else {
                timerEl.classList.remove('text-red-500', 'animate-pulse');
            }
        }, 1000);
    }

    function endGame() {
        gameActive = false; clearInterval(gameInterval); clearInterval(spawnInterval);
        Object.keys(sessionCaptures).forEach(k => stats[k] = (stats[k]||0) + sessionCaptures[k]);
        localStorage.setItem(localId + '-stats', JSON.stringify(stats));
        if (score > highScore) { 
            highScore = score; 
            localStorage.setItem(localId + '-highscore', highScore);
            if (userName) window.uploadScore(userName, highScore);
        }
        overlay.innerHTML = `
            <h1 class="game-title">TIEMPO AGOTADO</h1>
            <div class="text-4xl text-yellow-300 font-bold mb-6">${score} Puntos</div>
            <div class="flex flex-col gap-3 w-full max-w-xs">
                <button onclick="startGame()" class="btn">REINTENTAR</button>
                <button onclick="window.currentTab='leaderboard'; window.showMainMenu()" class="btn btn-secondary">CLASIFICACIÓN</button>
                <button onclick="window.currentTab='achievements'; window.showMainMenu()" class="btn btn-secondary">MENÚ PRINCIPAL</button>
            </div>
        `;
        overlay.style.display = 'flex';
        updateMusic('menu');
    }

    function initEnv() {
        const clouds = document.getElementById('clouds-container');
        const flowers = document.getElementById('flowers-container');
        for(let i=0; i<5; i++) {
            const c = document.createElement('div'); c.className = 'cloud';
            c.style.width = (100+Math.random()*100)+'px'; c.style.height = '40px';
            c.style.top = (Math.random()*40)+'%'; c.style.animationDuration = (20+Math.random()*10)+'s';
            c.style.animationDelay = -(Math.random()*20)+'s'; clouds.appendChild(c);
        }
        for(let i=0; i<30; i++) {
            const f = document.createElement('div'); f.className = 'flower';
            f.style.left = Math.random()*100+'%'; f.style.top = Math.random()*100+'%';
            f.style.background = ['#fff','#f48fb1','#ffeb3b'][Math.floor(Math.random()*3)]; flowers.appendChild(f);
        }
        applyBackground(currentBackground);
    }

    initEnv();
    window.addEventListener('click', () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (!gameActive && currentMusicType !== 'menu') updateMusic('menu');
    }, { once: false });

    setTimeout(() => window.showMainMenu(), 500);
</script>
